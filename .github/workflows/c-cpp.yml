name: C/C++ CI

on:
  push:
    branches: [ master, cross-platform ]
  pull_request:
    branches: [ master, cross-platform ]
  workflow_dispatch:

# x64 only: the tests build the DLL too, and the fork's DLL isn't published (Windows' RALibretro downloads the official
# one); the macOS/Linux builds are RALibretro's
jobs:
  Win64-Tests:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Submodules
      # only those RA_Integration.sln uses (not wxWidgets, the macOS/Linux UI, nor rapidjson's googletest), without
      # their history
      run: git submodule update --init --depth 1 --jobs 4 rapidjson rcheevos GSL RAInterface
    - name: Install MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Find VSTest
      shell: pwsh
      # vstest.console.exe comes with Visual Studio (Malcolmnixon/Setup-VSTest did this, on a retired Node.js); by its
      # path: a "**" pattern searches all of Visual Studio, which takes about a minute
      run: |
        $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "Common7\IDE\Extensions\TestPlatform\vstest.console.exe" | Select-Object -First 1
        if (-not $vstest) { throw "vstest.console.exe not found" }
        Split-Path $vstest | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
    - name: Build
      run: msbuild.exe -m RA_Integration.sln -p:Configuration=Release -p:Platform=x64
    - name: Run lib Tests
      run: vstest.console bin\x64\Release\RADevKit.Tests.dll
    - name: Run DLL Tests
      run: vstest.console bin\x64\Release\RA_Integration.Tests.dll
    - name: Run Interface Tests
      # requires the DLL to have been built
      run: vstest.console bin\x64\Release\RA_Interface.Tests.dll

  Win64-Analysis:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Submodules
      # only those RA_Integration.sln uses (not wxWidgets, the macOS/Linux UI, nor rapidjson's googletest), without
      # their history
      run: git submodule update --init --depth 1 --jobs 4 rapidjson rcheevos GSL RAInterface
    - name: Install MSBuild
      uses: microsoft/setup-msbuild@v3
    - name: Build
      run: msbuild.exe -m RA_Integration.sln -p:Configuration=Analysis -p:Platform=x64 /WarnAsError
